<form
  action="https://formspree.io/f/mgavrvgv"
  method="POST"
  class="contact-form"
>
  <div class="form-group">
    <label for="name">Ad Soyad</label>
    <input
      type="text"
      id="name"
      name="name"
      placeholder="Adını ve soyadını yaz"
      required
    />
  </div>

  <div class="form-group">
    <label for="email">E-posta</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="ornek@mail.com"
      required
    />
  </div>

  <div class="form-group">
    <label for="project">Proje Türü</label>
    <select id="project" name="project" required>
      <option value="">Seçiniz</option>
      <option value="Web Tasarım">Web Tasarım</option>
      <option value="Logo / Marka">Logo / Marka</option>
      <option value="Sosyal Medya">Sosyal Medya</option>
      <option value="UI/UX">UI/UX Tasarım</option>
      <option value="Diğer">Diğer</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message">Projen</label>
    <textarea
      id="message"
      name="message"
      rows="6"
      placeholder="Projen hakkında biraz bahset..."
      required
    ></textarea>
  </div>

  <input
    type="hidden"
    name="_subject"
    value="Violet Studio - Yeni Proje Talebi"
  />

  <button type="submit" class="btn btn-primary">
    Projeyi Gönder →
  </button>
</form>
